version: '3.8'
services:
  postgres-db:
    image: postgres:15
    container_name: postgres-container
    ports:
      - "5332:5432"
    environment:
      POSTGRES_DB: My_Shop_DB
      POSTGRES_USER: shreeram
      POSTGRES_PASSWORD: password
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
